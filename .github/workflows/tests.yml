name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python unit and security tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full app smoke test
        run: python tests/test_app.py
      - name: Resume feedback checks
        run: node tests/test_resume_feedback.cjs
      - name: Job link and template checks
        run: node tests/test_job_links.cjs

